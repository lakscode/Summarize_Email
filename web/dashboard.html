<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard · SummarizeMail</title>
  <link rel="stylesheet" href="assets/app.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="assets/common.js"></script>
</head>
<body>
  <div class="shell" hidden>
    <aside id="sidebar" class="sidebar"></aside>

    <main class="content">
      <div id="message" class="message" hidden></div>
      <h1 id="greeting">Dashboard</h1>
      <p class="sub">You're signed in.</p>
      <section class="grid">
        <div class="tile"><div class="label">Name</div><div class="value" id="profile-name">—</div></div>
        <div class="tile"><div class="label">Email</div><div class="value" id="profile-email">—</div></div>
        <div class="tile"><div class="label">Member since</div><div class="value" id="profile-since">—</div></div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <div>
            <h2>Mailboxes</h2>
            <p class="sub">Connect an Azure / Microsoft 365 (Outlook) mailbox to summarize.</p>
          </div>
          <button id="add-azure">Add Azure mailbox</button>
        </div>
        <ul class="list" id="mailbox-list"></ul>
        <p class="empty" id="mailbox-empty" hidden>No mailboxes connected yet.</p>
      </section>
    </main>
  </div>

  <script>
    (async () => {
      const session = await requireSession();
      if (!session) return;
      const { user } = session;

      renderSidebar("dashboard", session);
      document.querySelector(".shell").hidden = false;

      // The OAuth callback redirects back here with ?connected= / ?connect_error=; show that first so
      // a later load error doesn't hide it.
      showConnectResult();

      // Supabase Edge Function API: supabase/functions/profile
      const { data, error } = await callApi("profile", { method: "GET" });
      if (error) showMessage(`Could not load profile: ${error}`, "error");
      const profile = data?.profile;

      const name = profile?.full_name || user.user_metadata?.full_name || "";
      document.getElementById("greeting").textContent = name ? `Hello, ${name}` : "Dashboard";
      document.getElementById("profile-name").textContent = name || "—";
      document.getElementById("profile-email").textContent = profile?.email || user.email;
      document.getElementById("profile-since").textContent =
        new Date(profile?.created_at || user.created_at).toLocaleDateString();

      await loadMailboxes();
    })();

    // --- Mailboxes (Supabase Edge Function API: supabase/functions/mailboxes) ---

    function showConnectResult() {
      const params = new URLSearchParams(location.search);
      if (params.has("connected")) showMessage(`Connected ${params.get("connected")}.`, "ok");
      else if (params.has("connect_error")) showMessage(params.get("connect_error"), "error");
      else return;
      history.replaceState(null, "", location.pathname);
    }

    async function loadMailboxes() {
      const { data, error } = await callApi("mailboxes", { method: "GET" });
      if (error) return showMessage(`Could not load mailboxes: ${error}`, "error");
      const list = document.getElementById("mailbox-list");
      list.replaceChildren(...data.mailboxes.map(mailboxRow));
      document.getElementById("mailbox-empty").hidden = data.mailboxes.length > 0;
    }

    function mailboxRow(m) {
      const li = document.createElement("li");
      const info = document.createElement("div");
      const email = document.createElement("div");
      email.className = "value";
      email.textContent = m.email_address;
      const meta = document.createElement("div");
      meta.className = "label";
      meta.textContent = `${m.display_name ? m.display_name + " · " : ""}Azure · connected ${new Date(m.created_at).toLocaleDateString()}`;
      info.append(email, meta);

      const remove = document.createElement("button");
      remove.className = "secondary";
      remove.textContent = "Disconnect";
      remove.addEventListener("click", async () => {
        if (!confirm(`Disconnect ${m.email_address}?`)) return;
        remove.disabled = true;
        const { error } = await callApi(`mailboxes?id=${encodeURIComponent(m.id)}`, { method: "DELETE" });
        if (error) {
          remove.disabled = false;
          return showMessage(`Could not disconnect: ${error}`, "error");
        }
        showMessage(`Disconnected ${m.email_address}.`, "ok");
        await loadMailboxes();
      });

      li.append(info, remove);
      return li;
    }

    document.getElementById("add-azure").addEventListener("click", async (e) => {
      const button = e.currentTarget;
      button.disabled = true;
      showMessage("");
      const { data, error } = await callApi("mailboxes", { body: { action: "connect" } });
      if (error) {
        button.disabled = false;
        return showMessage(error, "error");
      }
      location.href = data.url;
    });
  </script>
</body>
</html>
