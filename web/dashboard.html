<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard · SummarizeMail</title>
  <link rel="stylesheet" href="assets/app.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="assets/common.js"></script>
</head>
<body>
  <div class="shell" hidden>
    <aside id="sidebar" class="sidebar"></aside>

    <main class="content">
      <div id="message" class="message" hidden></div>
      <h1 id="greeting">Dashboard</h1>
      <p class="sub">You're signed in.</p>
      <section class="grid">
        <div class="tile"><div class="label">Name</div><div class="value" id="profile-name">—</div></div>
        <div class="tile"><div class="label">Email</div><div class="value" id="profile-email">—</div></div>
        <div class="tile"><div class="label">Member since</div><div class="value" id="profile-since">—</div></div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <div>
            <h2>Mailboxes</h2>
            <p class="sub">Connect an Azure / Microsoft 365 (Outlook) or Gmail mailbox to summarize.</p>
          </div>
          <div class="connect-controls">
            <label>Allow access for
              <select id="access-days">
                <option value="1">1 day</option>
                <option value="7">7 days</option>
                <option value="30" selected>30 days</option>
                <option value="90">90 days</option>
              </select>
            </label>
            <button class="connect-button" data-provider="microsoft">Add Azure mailbox</button>
            <button class="connect-button" data-provider="google">Add Gmail mailbox</button>
          </div>
        </div>
        <p class="hint">The app keeps an encrypted Microsoft token only for the period you choose, then deletes it. Reconnect to extend.</p>
        <ul class="list" id="mailbox-list"></ul>
        <p class="empty" id="mailbox-empty" hidden>No mailboxes connected yet.</p>
      </section>
    </main>
  </div>

  <script>
    (async () => {
      const session = await requireSession();
      if (!session) return;
      const { user } = session;

      renderSidebar("dashboard", session);
      document.querySelector(".shell").hidden = false;

      // Without a popup, the OAuth callback redirects back here with ?connected= / ?connect_error=; show
      // that first so a later load error doesn't hide it.
      if (showConnectResult(new URLSearchParams(location.search))) history.replaceState(null, "", location.pathname);

      // Supabase Edge Function API: supabase/functions/profile
      const { data, error } = await callApi("profile", { method: "GET" });
      if (error) showMessage(`Could not load profile: ${error}`, "error");
      const profile = data?.profile;

      const name = profile?.full_name || user.user_metadata?.full_name || "";
      document.getElementById("greeting").textContent = name ? `Hello, ${name}` : "Dashboard";
      document.getElementById("profile-name").textContent = name || "—";
      document.getElementById("profile-email").textContent = profile?.email || user.email;
      document.getElementById("profile-since").textContent =
        new Date(profile?.created_at || user.created_at).toLocaleDateString();

      await loadMailboxes();
    })();

    // --- Mailboxes (Supabase Edge Function API: supabase/functions/mailboxes) ---

    // Shows the outcome of a Microsoft sign-in; returns false if `params` carries none.
    function showConnectResult(params) {
      if (params.has("connected")) {
        const days = Number(params.get("days"));
        showMessage(`Connected ${params.get("connected")}${days ? ` for ${days} day${days === 1 ? "" : "s"}` : ""}.`, "ok");
      }
      else if (params.has("connect_error")) showMessage(params.get("connect_error"), "error");
      else return false;
      return true;
    }

    async function loadMailboxes() {
      const { data, error } = await callApi("mailboxes", { method: "GET" });
      if (error) return showMessage(`Could not load mailboxes: ${error}`, "error");
      const list = document.getElementById("mailbox-list");
      list.replaceChildren(...data.mailboxes.map(mailboxRow));
      document.getElementById("mailbox-empty").hidden = data.mailboxes.length > 0;
    }

    function mailboxRow(m) {
      const li = document.createElement("li");
      const info = document.createElement("div");
      const email = document.createElement("div");
      email.className = "value";
      email.textContent = m.email_address;
      const meta = document.createElement("div");
      meta.className = "label";
      meta.textContent = `${m.display_name ? m.display_name + " · " : ""}${PROVIDER_LABELS[m.provider] || "Azure"} · connected ${new Date(m.created_at).toLocaleDateString()}`;

      // Access window: active until access_expires_at, then the token is deleted and a reconnect is needed.
      const expired = !m.active || (m.access_expires_at && new Date(m.access_expires_at) <= new Date());
      const access = document.createElement("div");
      access.className = expired ? "access expired" : "access";
      if (expired) {
        access.textContent = "Access expired. ";
        const reconnect = document.createElement("button");
        reconnect.className = "link-button";
        reconnect.textContent = "Reconnect";
        reconnect.addEventListener("click", () => startConnect(reconnect, m.provider || "microsoft"));
        access.append(reconnect);
      } else {
        access.textContent = m.access_expires_at
          ? `Access until ${new Date(m.access_expires_at).toLocaleString()}`
          : "Access has no expiry (connected before access periods). Reconnect to set one.";
      }
      info.append(email, meta, access, smartApForm(m));

      const remove = document.createElement("button");
      remove.className = "secondary";
      remove.textContent = "Disconnect";
      remove.addEventListener("click", async () => {
        if (!confirm(`Disconnect ${m.email_address}?`)) return;
        remove.disabled = true;
        const { error } = await callApi(`mailboxes?id=${encodeURIComponent(m.id)}`, { method: "DELETE" });
        if (error) {
          remove.disabled = false;
          return showMessage(`Could not disconnect: ${error}`, "error");
        }
        showMessage(`Disconnected ${m.email_address}.`, "ok");
        await loadMailboxes();
      });

      li.append(info, remove);
      return li;
    }

    // Where the Inbox processor forwards invoices for this mailbox.
    function smartApForm(m) {
      const form = document.createElement("form");
      form.className = "inline-form";
      const label = document.createElement("label");
      label.textContent = "Smart AP address";
      const input = document.createElement("input");
      input.type = "email";
      input.name = "smart_ap_address";
      input.placeholder = "invoices@your-ap-system.com";
      input.value = m.smart_ap_address || "";
      label.append(input);
      const save = document.createElement("button");
      save.type = "submit";
      save.className = "secondary";
      save.textContent = "Save";
      form.append(label, save);
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        setBusy(form, true);
        const { error } = await callApi("mailboxes", { method: "PATCH", body: { id: m.id, smart_ap_address: input.value } });
        setBusy(form, false);
        if (error) return showMessage(`Could not save Smart AP address: ${error}`, "error");
        showMessage(input.value ? `Invoices from ${m.email_address} will be forwarded to ${input.value}.` : "Smart AP address cleared.", "ok");
      });
      return form;
    }

    const PROVIDER_LABELS = { microsoft: "Azure", google: "Gmail" };

    // Starts Microsoft or Google sign-in in a popup; the chosen access period is carried through to the callback.
    // The popup is opened straight from the click (before the API call) so browsers don't block it; if they
    // do anyway, sign-in falls back to navigating this page.
    async function startConnect(button, provider) {
      button.disabled = true;
      showMessage("");
      const popup = openCentered(500, 650);
      if (popup) popup.document.body.textContent = `Opening ${provider === "google" ? "Google" : "Microsoft"} sign-in…`;
      const access_days = Number(document.getElementById("access-days").value);
      const { data, error } = await callApi("mailboxes", { body: { action: "connect", provider, access_days, popup: !!popup } });
      if (error) {
        popup?.close();
        button.disabled = false;
        return showMessage(error, "error");
      }
      if (!popup) return (location.href = data.url);

      popup.location.href = data.url;
      popup.focus();
      const watch = setInterval(() => {
        if (!popup.closed) return;
        clearInterval(watch);
        button.disabled = false;
      }, 500);
    }

    function openCentered(width, height) {
      const left = Math.round(window.screenX + (window.outerWidth - width) / 2);
      const top = Math.round(window.screenY + (window.outerHeight - height) / 2);
      return window.open("", "mailbox-sign-in", `popup,width=${width},height=${height},left=${left},top=${top}`);
    }

    // connect-done.html (loaded in the popup at the end of sign-in) reports the outcome here.
    new BroadcastChannel("mailbox-connect").addEventListener("message", async (e) => {
      for (const b of document.querySelectorAll(".connect-button")) b.disabled = false;
      showConnectResult(new URLSearchParams(e.data));
      await loadMailboxes();
    });

    for (const b of document.querySelectorAll(".connect-button")) {
      b.addEventListener("click", () => startConnect(b, b.dataset.provider));
    }
  </script>
</body>
</html>
