<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Logs</title>
  <link rel="stylesheet" href="assets/app.css" />
  <link rel="icon" type="image/png" href="images/favicon.png" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="assets/brand.js"></script>
  <script src="assets/common.js"></script>
</head>
<body>
  <div class="shell" hidden>
    <aside id="sidebar" class="sidebar"></aside>

    <main class="content">
      <div id="message" class="message" hidden></div>
      <h1>Logs</h1>
      <p class="sub">Logs from the web app (UI) and the Supabase Edge Functions (API), a step-by-step trail of every inbox run, and the processing history: every processing of every email, who did it, when, in which mailbox, and what came of it. Newest first.</p>

      <div class="toolbar">
        <div class="filters">
          <div class="tabs" role="tablist" id="kind-tabs">
            <button class="tab active" data-kind="">Everything</button>
            <button class="tab" data-kind="problems">Errors</button>
            <button class="tab" data-kind="steps">Steps</button>
            <button class="tab" data-kind="emails">Processing history</button>
          </div>
          <div class="tabs" role="tablist" id="source-tabs">
            <button class="tab active" data-source="">All</button>
            <button class="tab" data-source="ui">UI</button>
            <button class="tab" data-source="api">API</button>
          </div>
        </div>
        <div class="toolbar-actions">
          <button class="secondary" id="refresh">Refresh</button>
          <button class="secondary" id="clear">Clear</button>
        </div>
      </div>

      <form class="log-filters" id="log-filters">
        <label>Mailbox
          <select name="mailbox"><option value="">All mailboxes</option></select>
        </label>
        <label id="user-filter" hidden>User
          <select name="user"><option value="">All users</option></select>
        </label>
        <label>From
          <input type="date" name="from" />
        </label>
        <label>To
          <input type="date" name="to" />
        </label>
        <button type="button" class="link-button" id="filters-clear" hidden>Clear filters</button>
      </form>

      <div class="run-banner" id="run-banner" hidden>
        <span id="run-label"></span>
        <button class="link-button" id="run-clear">Show all logs</button>
      </div>

      <div class="panel log-panel">
        <table class="logs">
          <thead id="log-head"></thead>
          <tbody id="log-rows"></tbody>
        </table>
        <p class="empty" id="log-empty" hidden>No logs.</p>
      </div>
    </main>
  </div>

  <script>
    // The page state, also kept in the address bar so a filtered view can be reloaded or shared.
    const initial = new URLSearchParams(location.search);
    let source = initial.get("source") || "";
    let kind = initial.get("kind") || "";
    let run = initial.get("run") || "";
    let email = initial.get("email") || ""; // one processed email (from the Inbox's "View logs")
    let others = false; // whether the caller can see other users' logs (shows the User filter and column)
    const filtersForm = document.getElementById("log-filters");

    const CATEGORY_LABELS = {
      invoice: "Invoice", utility_bill: "Utility bill", vendor_info: "Vendor info", statement: "Statement",
      remittance: "Remittance", purchase_order: "Purchase order", customer_inquiry: "Customer inquiry", other: "Other",
      not_relevant: "Not relevant",
    };
    const TRIGGER_LABELS = { manual: "Process inbox", schedule: "Scheduled run", user: "By hand" };
    const STATUS_LABELS = {
      action_needed: "Action needed", done: "Done", no_action: "No action needed", processing: "Processing", error: "Error",
    };

    (async () => {
      const session = await requireSession();
      if (!session) return;
      renderSidebar("logs", session);
      document.querySelector(".shell").hidden = false;
      for (const name of ["from", "to"]) filtersForm.elements[name].value = initial.get(name) || "";
      syncTabs();
      await loadFilters();
      await loadLogs();
    })();

    // Mailbox and user choices: the caller's own, their organization's (organization admin) or everyone's (super admin).
    async function loadFilters() {
      const { data, error } = await callApi("logs?filters=1", { method: "GET" });
      if (error) return;
      others = data.others;
      const mailboxSelect = filtersForm.elements.mailbox;
      mailboxSelect.append(...data.mailboxes.map((m) => new Option(m, m)));
      mailboxSelect.value = initial.get("mailbox") || "";
      const userSelect = filtersForm.elements.user;
      userSelect.append(...data.users.map((u) => new Option(u.email && u.email !== u.name ? `${u.name} (${u.email})` : u.name, u.id)));
      userSelect.value = initial.get("user") || "";
      document.getElementById("user-filter").hidden = !others;
    }

    function filterValues() {
      const f = Object.fromEntries(new FormData(filtersForm));
      if (!others) delete f.user;
      return f;
    }

    async function loadLogs() {
      const f = filterValues();
      const state = new URLSearchParams();
      if (source && kind !== "emails") state.set("source", source);
      if (kind) state.set("kind", kind);
      if (run) state.set("run", run);
      if (email) state.set("email", email);
      for (const key of ["mailbox", "user", "from", "to"]) if (f[key]) state.set(key, f[key]);
      history.replaceState(null, "", state.size ? `?${state}` : location.pathname);
      document.getElementById("filters-clear").hidden = !["mailbox", "user", "from", "to"].some((k) => f[k]);

      // Dates are whole days in the viewer's time zone: from the start of From to the end of To.
      const params = new URLSearchParams(state);
      params.delete("from");
      params.delete("to");
      if (f.from) params.set("from", new Date(`${f.from}T00:00`).toISOString());
      if (f.to) {
        const end = new Date(`${f.to}T00:00`);
        end.setDate(end.getDate() + 1);
        params.set("to", end.toISOString());
      }

      const { data, error } = await callApi(`logs?${params}`, { method: "GET" });
      if (error) {
        // Not via showMessage(..., "error"): if the logs API is down, logging that would fail too.
        const el = document.getElementById("message");
        el.textContent = `Could not load logs: ${error}`;
        el.className = "message error";
        el.hidden = false;
        return;
      }
      document.getElementById("message").hidden = true;

      document.getElementById("run-banner").hidden = !run && !email;
      if (email) {
        const subject = data.logs.map((l) => l.subject ?? l.context?.subject).find(Boolean);
        document.getElementById("run-label").textContent =
          `Showing the ${kind === "emails" ? "processing history" : "logs"} of one email${subject ? `, "${subject}"` : ""}, in order.`;
      } else {
        document.getElementById("run-label").textContent = !run ? ""
          : kind === "emails" ? `Showing the emails of run ${run}.` : `Showing every step of run ${run}, in order.`;
      }
      const columns = kind === "emails"
        ? ["Time", "Mailbox", "Email", "Processed by", "How", "Outcome"]
        : ["Time", ...(others ? ["User"] : []), "Source", "Level", "Where", "Message"];
      const head = document.createElement("tr");
      head.append(...columns.map((c) => Object.assign(document.createElement("th"), { textContent: c })));
      document.getElementById("log-head").replaceChildren(head);
      document.getElementById("log-rows").replaceChildren(...data.logs.map(kind === "emails" ? emailRow : logRow));
      document.getElementById("log-empty").hidden = data.logs.length > 0;
    }

    function cell(text, className) {
      const td = document.createElement("td");
      if (className) td.className = className;
      td.textContent = text;
      return td;
    }

    function runLink(id, label, nextKind) {
      const follow = document.createElement("button");
      follow.className = "link-button run-link";
      follow.textContent = label;
      follow.addEventListener("click", () => {
        run = id;
        kind = nextKind;
        syncTabs();
        loadLogs();
      });
      return follow;
    }

    function logRow(log) {
      const tr = document.createElement("tr");
      tr.append(cell(new Date(log.created_at).toLocaleString(), "nowrap"));
      if (others) tr.append(cell(log.user_name || "—", "nowrap"));
      tr.append(
        badgeCell(log.source.toUpperCase(), `badge source-${log.source}`),
        badgeCell(log.level, `badge level-${log.level}`),
        cell(log.location || "—", "mono"),
      );

      const msg = document.createElement("td");
      msg.className = "msg";
      const text = document.createElement("div");
      text.textContent = log.message;
      msg.append(text);
      if (log.context?.run && !run) msg.append(runLink(log.context.run, `Show run ${log.context.run}`, kind === "emails" ? "" : kind));
      if (log.context && Object.keys(log.context).length) {
        const details = document.createElement("details");
        const summary = document.createElement("summary");
        summary.textContent = "Details";
        const pre = document.createElement("pre");
        pre.textContent = JSON.stringify(log.context, null, 2);
        details.append(summary, pre);
        msg.append(details);
      }
      tr.append(msg);
      return tr;
    }

    // One email_processing_log row: which email, who processed it and how, and what came of it.
    function emailRow(h) {
      const tr = document.createElement("tr");
      const outcome = document.createElement("td");
      outcome.className = "msg";
      const badge = document.createElement("span");
      badge.className = `pill action-${h.status}`;
      badge.textContent = STATUS_LABELS[h.status] || h.status;
      outcome.append(badge);
      const detail = h.error || h.action;
      if (detail) outcome.append(Object.assign(document.createElement("div"), { textContent: detail }));
      if (h.run_id && !run) outcome.append(runLink(h.run_id, `Show run ${h.run_id} steps`, "steps"));

      // The email as this processing left it (a snapshot: later processing doesn't change it).
      const facts = [
        ["Received", h.received_at && new Date(h.received_at).toLocaleString()],
        ["Category", h.category && `${CATEGORY_LABELS[h.category] || h.category}${h.confidence ? ` (${h.confidence} confidence)` : ""}`],
        ["Vendor", h.vendor], ["Invoice #", h.invoice_number], ["Amount", h.amount], ["Due", h.due_date],
        ["Attachments", h.attachment_names?.join(", ")],
        ["Summary", h.summary],
        ["Next step", h.next_step],
      ].filter(([, v]) => v);
      if (facts.length || h.web_link) {
        const details = document.createElement("details");
        details.append(Object.assign(document.createElement("summary"), { textContent: "Details" }));
        const dl = document.createElement("dl");
        dl.className = "facts";
        for (const [k, v] of facts) {
          dl.append(Object.assign(document.createElement("dt"), { textContent: k }), Object.assign(document.createElement("dd"), { textContent: v }));
        }
        details.append(dl);
        if (h.web_link) {
          const open = Object.assign(document.createElement("a"), { href: h.web_link, target: "_blank", rel: "noopener", textContent: "Open in mailbox" });
          details.append(open);
        }
        outcome.append(details);
      }

      const email = document.createElement("td");
      email.className = "msg";
      email.append(Object.assign(document.createElement("div"), { textContent: h.subject || "(no subject)" }));
      const sender = h.from_name ? `${h.from_name} <${h.from_address}>` : h.from_address;
      if (sender) email.append(Object.assign(document.createElement("div"), { className: "muted", textContent: sender }));

      // A scheduled run is recorded as the mailbox owner (whose account it runs as): say it was the scheduler.
      const scheduled = h.trigger === "schedule";
      const who = cell(scheduled ? "Scheduler" : h.processed_by_name || h.processed_by_email || "—", "nowrap");
      if (scheduled) who.title = `Automatic, as ${h.processed_by_name || h.processed_by_email || "the mailbox owner"}`;
      else if (h.processed_by_email) who.title = h.processed_by_email;
      tr.append(
        cell(new Date(h.processed_at).toLocaleString(), "nowrap"),
        cell(h.mailbox_address || "—"),
        email,
        who,
        cell(TRIGGER_LABELS[h.trigger] || h.trigger, "nowrap"),
        outcome,
      );
      return tr;
    }

    function badgeCell(text, className) {
      const td = document.createElement("td");
      const span = document.createElement("span");
      span.className = className;
      span.textContent = text;
      td.append(span);
      return td;
    }

    // Tabs follow the state; the UI / API tabs don't apply to email processing.
    function syncTabs() {
      document.querySelectorAll("#kind-tabs .tab").forEach((t) => t.classList.toggle("active", t.dataset.kind === kind));
      document.querySelectorAll("#source-tabs .tab").forEach((t) => t.classList.toggle("active", t.dataset.source === source));
      document.getElementById("source-tabs").hidden = kind === "emails";
    }

    // Two independent tab groups: what kind of entry (errors / steps / emails) and where it came from (UI / API).
    for (const group of ["kind-tabs", "source-tabs"]) {
      for (const tab of document.querySelectorAll(`#${group} .tab`)) {
        tab.addEventListener("click", () => {
          if (group === "kind-tabs") kind = tab.dataset.kind;
          else source = tab.dataset.source;
          syncTabs();
          loadLogs();
        });
      }
    }

    filtersForm.addEventListener("change", loadLogs);
    filtersForm.addEventListener("submit", (ev) => ev.preventDefault());
    document.getElementById("filters-clear").addEventListener("click", () => {
      filtersForm.reset();
      loadLogs();
    });

    document.getElementById("run-clear").addEventListener("click", () => {
      run = "";
      email = "";
      loadLogs();
    });

    document.getElementById("refresh").addEventListener("click", loadLogs);

    // Clears only the caller's own logs (also when viewing others'); the email processing history is kept.
    document.getElementById("clear").addEventListener("click", async () => {
      if (!confirm("Delete all of your logs? The email processing history is kept.")) return;
      const { error } = await callApi("logs", { method: "DELETE" });
      if (error) return showMessage(`Could not clear logs: ${error}`, "error");
      await loadLogs();
    });
  </script>
</body>
</html>
