<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AP Inbox Sign Up</title>
<link rel="stylesheet" href="assets/app.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<script src="config.js"></script>
</head>
<body>
<div class="auth-wrap">
  <div class="panel auth-card">
    <h1>Create your account</h1>
    <p class="muted" style="margin-top:0">Sign up with your work email. You'll connect the AP mailbox after signing in.</p>

    <div id="message" class="notice hidden" style="margin-bottom:12px"></div>

    <form id="signupForm" style="display:grid; gap:10px">
      <label>Full name<input name="full_name" autocomplete="name" required></label>
      <label>Work email<input type="email" name="email" autocomplete="email" required></label>
      <label>Password<input type="password" name="password" autocomplete="new-password" minlength="8" required></label>
      <label>Confirm password<input type="password" name="confirm" autocomplete="new-password" minlength="8" required></label>
      <p class="muted small" style="margin:0">At least 8 characters.</p>
      <button class="primary block" id="submitBtn">Create account</button>
    </form>

    <p class="small" style="margin-bottom:0">Already have an account? <a href="login.html">Sign in</a></p>
  </div>
</div>

<script type="module">
import { $, page, sb } from "./assets/common.js";

function show(text, kind = "err") {
  const m = $("message");
  m.textContent = text;
  m.className = `notice ${kind}`;
}

const { data: { session } } = await sb.auth.getSession();
if (session) location.replace(page("index.html"));

$("signupForm").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const f = ev.target;
  if (f.password.value !== f.confirm.value) return show("The passwords don't match.");
  $("submitBtn").disabled = true;
  try {
    const { data, error } = await sb.auth.signUp({
      email: f.email.value.trim(),
      password: f.password.value,
      options: { data: { full_name: f.full_name.value.trim() }, emailRedirectTo: page("index.html") },
    });
    if (error) throw error;
    if (data.session) {
      location.replace(page("index.html"));
    } else {
      f.classList.add("hidden");
      show(`Almost done: we sent a confirmation link to ${f.email.value.trim()}. Open it to activate your account, then sign in.`, "ok");
    }
  } catch (e) {
    show(e.message);
  } finally {
    $("submitBtn").disabled = false;
  }
});
</script>
</body>
</html>
