<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Forgot password · SummarizeMail</title>
  <link rel="stylesheet" href="assets/app.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="assets/common.js"></script>
</head>
<body class="with-bg">
  <div class="auth">
    <div class="card">
      <h1>Forgot password</h1>
      <p class="sub">We'll email you a link to set a new password.</p>
      <div id="message" class="message" hidden></div>
      <form id="forgot-form">
        <label>Email
          <input type="email" name="email" autocomplete="email" required />
        </label>
        <button type="submit">Send reset link</button>
      </form>
      <p class="alt"><a href="login.html">Back to log in</a></p>
    </div>
  </div>

  <script>
    const form = document.getElementById("forgot-form");
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const { email } = Object.fromEntries(new FormData(form));
      showMessage("");
      setBusy(form, true);
      const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: pageUrl("reset-password") });
      setBusy(form, false);
      // Same message whether or not the address has an account, so the form can't be used to look up users.
      if (error) return showMessage(error.message, "error");
      form.reset();
      showMessage("If an account exists for that email, a reset link is on its way. It opens in a new tab.", "ok");
    });
  </script>
</body>
</html>
