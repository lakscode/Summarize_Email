<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reset password · SummarizeMail</title>
  <link rel="stylesheet" href="assets/app.css" />
  <link rel="icon" type="image/png" href="images/favicon.png" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="assets/common.js"></script>
</head>
<body class="with-bg">
  <div class="auth">
    <div class="card">
      <img class="auth-logo" src="images/logo-256.png" alt="SummarizeMail" width="64" height="64" />
      <h1>Set a new password</h1>
      <p class="sub">Choose a new password for your account.</p>
      <div id="message" class="message" hidden></div>
      <form id="reset-form" hidden>
        <label>New password
          <input type="password" name="password" autocomplete="new-password" minlength="6" required />
        </label>
        <label>Confirm password
          <input type="password" name="confirm" autocomplete="new-password" minlength="6" required />
        </label>
        <button type="submit">Update password</button>
      </form>
      <p class="alt"><a href="forgot-password.html">Request a new link</a> · <a href="login.html">Log in</a></p>
      <p class="legal-links"><a href="terms.html">Terms of Service</a> · <a href="privacy.html">Privacy Policy</a></p>
    </div>
  </div>

  <script>
    const form = document.getElementById("reset-form");

    // The emailed link signs this tab in with a short-lived recovery session (read from the URL by supabase-js).
    (async () => {
      const hash = new URLSearchParams(location.hash.slice(1));
      if (hash.get("error")) {
        return showMessage(hash.get("error_description") || "This reset link is invalid or has expired.", "error");
      }
      if (!(await getSession())) {
        return showMessage("This reset link is invalid or has expired. Request a new one.", "error");
      }
      form.hidden = false;
    })();

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const { password, confirm } = Object.fromEntries(new FormData(form));
      if (password !== confirm) return showMessage("Passwords don't match.", "error");
      showMessage("");
      setBusy(form, true);
      const { error } = await sb.auth.updateUser({ password });
      if (error) {
        setBusy(form, false);
        return showMessage(error.message, "error");
      }
      // Sign out the recovery session so the user logs in with the new password.
      await sb.auth.signOut();
      location.replace(pageUrl("login") + "?reset=1");
    });
  </script>
</body>
</html>
