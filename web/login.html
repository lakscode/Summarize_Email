<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AP Inbox Sign In</title>
<link rel="stylesheet" href="assets/app.css">
<script>window.__isRecoveryLink = /type=recovery/.test(location.hash);</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<script src="config.js"></script>
</head>
<body>
<div class="auth-wrap">
  <div class="panel auth-card">
    <h1 id="title">Sign in to AP Inbox</h1>
    <p class="muted" style="margin-top:0" id="subtitle">See and work through your accounts-payable action items.</p>

    <div id="message" class="notice hidden" style="margin-bottom:12px"></div>

    <!-- Sign in -->
    <form id="signinForm" style="display:grid; gap:10px">
      <label>Email<input type="email" name="email" autocomplete="email" required></label>
      <label>Password<input type="password" name="password" autocomplete="current-password" required></label>
      <div class="row between small">
        <a href="#" id="forgotLink">Forgot password?</a>
        <a href="#" id="linkLink">Email me a sign-in link instead</a>
      </div>
      <button class="primary block" id="signinBtn">Sign in</button>
    </form>

    <!-- Request a reset link or a sign-in link -->
    <form id="emailOnlyForm" class="hidden" style="display:grid; gap:10px">
      <label>Email<input type="email" name="email" autocomplete="email" required></label>
      <button class="primary block" id="emailOnlyBtn"></button>
      <a href="#" class="small" id="backLink">← Back to sign in</a>
    </form>

    <!-- Set a new password (after following a reset link) -->
    <form id="newPasswordForm" class="hidden" style="display:grid; gap:10px">
      <label>New password<input type="password" name="password" autocomplete="new-password" minlength="8" required></label>
      <label>Confirm new password<input type="password" name="confirm" autocomplete="new-password" minlength="8" required></label>
      <button class="primary block">Save new password</button>
    </form>

    <p class="small" style="margin-bottom:0" id="signupPrompt">New to AP Inbox? <a href="signup.html">Create an account</a></p>
  </div>
</div>

<script type="module">
import { $, page, sb } from "./assets/common.js";

const next = new URLSearchParams(location.search).get("next") || "index.html";
const destination = page(next.replace(/^[/\\]+/, "")); // stay on this site
let recovering = window.__isRecoveryLink; // captured before supabase-js clears the URL
let emailOnlyMode = "reset";

function show(text, kind = "err") {
  const m = $("message");
  m.textContent = text;
  m.className = `notice ${kind}`;
}

function view(name) {
  for (const id of ["signinForm", "emailOnlyForm", "newPasswordForm"]) $(id).classList.toggle("hidden", id !== name);
  $("signupPrompt").classList.toggle("hidden", name === "newPasswordForm");
  $("message").className = "notice hidden";
}

// Arriving from a password-reset email: let the user choose a new password before continuing.
function startRecovery() {
  recovering = true;
  $("title").textContent = "Choose a new password";
  $("subtitle").textContent = "Enter a new password for your account.";
  view("newPasswordForm");
}
if (recovering) startRecovery();
sb.auth.onAuthStateChange((event, s) => {
  if (event === "PASSWORD_RECOVERY") startRecovery();
  else if (s && !recovering) location.replace(destination);
});

const err = new URLSearchParams(location.hash.slice(1)).get("error_description") ||
            new URLSearchParams(location.search).get("error_description");
if (err) show(err);

$("signinForm").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const f = ev.target;
  $("signinBtn").disabled = true;
  const { error } = await sb.auth.signInWithPassword({ email: f.email.value.trim(), password: f.password.value });
  $("signinBtn").disabled = false;
  if (error) {
    show(/confirm/i.test(error.message)
      ? "Please confirm your email first - open the link we sent when you signed up."
      : /invalid login/i.test(error.message) ? "Email or password is incorrect." : error.message);
  }
});

function openEmailOnly(mode) {
  emailOnlyMode = mode;
  view("emailOnlyForm");
  $("emailOnlyForm").email.value = $("signinForm").email.value;
  $("emailOnlyBtn").textContent = mode === "reset" ? "Email me a reset link" : "Email me a sign-in link";
}
$("forgotLink").onclick = (ev) => { ev.preventDefault(); openEmailOnly("reset"); };
$("linkLink").onclick = (ev) => { ev.preventDefault(); openEmailOnly("link"); };
$("backLink").onclick = (ev) => { ev.preventDefault(); view("signinForm"); };

$("emailOnlyForm").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const email = ev.target.email.value.trim();
  $("emailOnlyBtn").disabled = true;
  const { error } = emailOnlyMode === "reset"
    ? await sb.auth.resetPasswordForEmail(email, { redirectTo: page("login.html") })
    : await sb.auth.signInWithOtp({ email, options: { emailRedirectTo: destination, shouldCreateUser: false } });
  $("emailOnlyBtn").disabled = false;
  if (error) return show(error.message);
  show(emailOnlyMode === "reset"
    ? `If ${email} has an account, a password reset link is on its way.`
    : `If ${email} has an account, a sign-in link is on its way.`, "ok");
});

$("newPasswordForm").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const f = ev.target;
  if (f.password.value !== f.confirm.value) return show("The passwords don't match.");
  const { error } = await sb.auth.updateUser({ password: f.password.value });
  if (error) return show(error.message);
  recovering = false;
  location.replace(destination);
});

// Already signed in (and not resetting a password)?
const { data: { session } } = await sb.auth.getSession();
if (session && !recovering) location.replace(destination);
</script>
</body>
</html>
